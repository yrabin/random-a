name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Browser end-to-end test
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node test/e2e/smoke.cjs

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t psle-otter:ci .
      - name: Smoke-test container
        run: |
          docker run -d --name otter -p 8080:8080 psle-otter:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/healthz && break || sleep 1; done
          curl -fsI http://localhost:8080/ | grep -i "content-security-policy"
          docker rm -f otter
